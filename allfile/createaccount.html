<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FakeChecker - Create Account</title>
  <link rel="stylesheet" href="createaccountcss.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="page">

    
    <header class="topbar">
      <div class="brand-box">
        <img src="logo.png" height="200" width="200" class="logo-img" alt="FakeChecker Logo">

      </div>

      <a href="index.html" class="back-link">BACK TO HOME</a>
    </header>

    
    <main class="create-section">
      <h1 class="create-title">নতুন অ্যাকাউন্ট তৈরি করুন/Create New Account</h1>

      <form class="create-form" action="createaccount.php" method="POST">
        <div class="form-group">
          <label for="name">আপনার নাম / Your Name :</label>
          <input type="text" id="name" name="full_name" required>
        </div>

        <div class="form-group">
          <label for="email">ইমেইল/Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">পাসওয়ার্ড/Password</label>
          <input type="password" id="password" name="password" placeholder="************" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">পাসওয়ার্ড নিশ্চিত করুন/Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirm_password" placeholder="************" required>
        </div>

        <button type="submit" class="create-btn-main">✅ অ্যাকাউন্ট তৈরি করুন/Create Account</button>
      </form>

      <div class="login-link-wrap">
        <p>ইতোমধ্যে অ্যাকাউন্ট আছে?/Already have an account?</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bottom-bar">
      <div class="language-box">
        <span>SELECT LANGUAGE</span>
        <span class="arrow">⌄</span>
      </div>

      <a href="login.html" class="login-btn-footer">Login/লগইন</a>
    </footer>
  </div>

  <script src="createaccountjs.js"></script>
</body>

</html>
