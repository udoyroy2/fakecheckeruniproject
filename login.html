<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FakeChecker - Login</title>
  <link rel="stylesheet" href="logincss.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="page">

    
    <header class="topbar">
      <div class="brand-box">
        <img src="logo.png" height="200" width="200" class="logo-img" alt="FakeChecker Logo">
      </div>

      <a href="index.html" class="back-link">BACK TO HOME</a>
    </header>

   
    <main class="login-section">
      <h1 class="login-title">LOGIN YOUR ACCOUNT</h1>

      <form class="login-form" action="login.php" method="POST">
        <div class="form-group">
          <label for="email">ইমেইল/Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">পাসওয়ার্ড/Password</label>
          <input type="password" id="password" name="password" placeholder="************" required>
        </div>

        <button type="submit" class="login-btn">Login/লগইন</button>
      </form>

      <a href="#" class="forgot-link">Forgot Password?</a>
    </main>

    
    <footer class="bottom-bar">
      <div class="language-box">
        <span>SELECT LANGUAGE</span>
        <span class="arrow">⌄</span>
      </div>

      <div class="account-box">
        <p>Don't have an account?</p>
        <a href="createaccount.html" class="create-btn">Create a New Account</a>
      </div>
    </footer>
  </div>

  <script src="loginjs.js"></script>
</body>

</html>
